# 抖音文案提取工具 —— nginx 接入片段（子路径方式，零 DNS 改动）
#
# 插入位置：/opt/shijian-ai/deploy/nginx.conf 中 listen 443 那个 server 块内，
#           放在 `location ~* ^/assets/.+$` 之前、`location /` 之前。
#
# 生效步骤（三选一按需）：
#   1) 备份：sudo cp -a /opt/shijian-ai/deploy/nginx.conf /opt/shijian-ai/deploy/nginx.conf.bak-$(date +%Y%m%d-%H%M)
#   2) 插入片段
#   3) 语法校验：sudo docker exec shijian-nginx nginx -t
#   4) 热加载：  sudo docker kill -s HUP shijian-nginx
#
# 回滚：把 .bak 覆盖回去，再 nginx -t + HUP。
#
# 注意：dytx-app 与 shijian-nginx 同在 deploy_internal 网络，故可直接用容器名解析。

    # ---- 抖音文案提取工具 ----
    location = /douyin {
        return 301 /douyin/;
    }

    location /douyin/ {
        proxy_pass http://dytx-app:3000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # 提取任务最长 30 分钟视频，轮询接口本身很快，这个值给足余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 2m;
    }
