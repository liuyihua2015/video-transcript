# 视频文案提取工具 —— nginx 接入片段（新增 /video/ 路径）
#
# 背景：工具已从「只支持抖音」扩展为多平台（抖音 / 快手 / 哔哩哔哩 + 通用引擎），
#       原来的 /douyin/ 路径名不再贴切，因此新增 /video/ 作为正式地址。
#       **/douyin/ 保持原样继续可用**（历史书签、分享出去的链接不会失效），
#       所以本片段只是「新增一个 location」，不改动任何已生效的配置。
#
# 插入位置：/opt/shijian-ai/deploy/nginx.conf 中 listen 443 那个 server 块内，
#           放在既有 `location /douyin/` 之后、`location ~* ^/assets/.+$` 之前。
#
# 生效步骤：
#   1) 备份：sudo cp -a nginx.conf nginx.conf.bak-$(date +%Y%m%d-%H%M)
#   2) 插入片段
#   3) 语法校验：sudo docker exec shijian-nginx nginx -t
#   4) 热加载：  sudo docker kill -s HUP shijian-nginx
#
# 回滚：把 .bak 覆盖回去，再 nginx -t + HUP。
#
# 注意：dytx-app 与 shijian-nginx 同在 deploy_internal 网络，故可直接用容器名解析。

    # ---- 视频文案提取工具（正式地址） ----
    location = /video {
        return 301 /video/;
    }

    location /video/ {
        proxy_pass http://dytx-app:3000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # 通用引擎（yt-dlp）解析境外站点可能拖到 60s+，轮询接口本身很快，这个值给足余量
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 2m;
    }
